<!--?xml version="1.0" encoding="UTF-8"?-->
<svg width="1920" height="1200" viewBox="0 0 1920 1200" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#303030"></stop>
      <stop offset="55%" stop-color="#262626"></stop>
      <stop offset="100%" stop-color="#202020"></stop>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9df3ff" stop-opacity="0.1"></stop>
      <stop offset="40%" stop-color="#9df3ff" stop-opacity="1"></stop>
      <stop offset="100%" stop-color="#9df3ff" stop-opacity="0.1"></stop>
    </linearGradient>

    <filter id="lineGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"></feGaussianBlur>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.6
                             0 0 0 0 0.95
                             0 0 0 0 1
                             0 0 0 0.9 0"></feColorMatrix>
    </filter>

    <style>
      .running-line {
        stroke: url(#lineGrad);
        stroke-width: 3;
        stroke-linecap: round;
        fill: none;
        stroke-dasharray: 160 260;
        animation: dashMove 4s linear infinite;
      }
      .running-line.slow {
        animation-duration: 7s;
      }

      @keyframes dashMove {
        0%   { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -420; }
      }

      .title-text {
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        font-weight: 600;
        letter-spacing: 0.35em;
        font-size: 40px;
      }

      .subtitle-text {
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        font-size: 15px;
        letter-spacing: 0.25em;
        text-transform: uppercase;
      }

      .card-title {
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        font-size: 18px;
        font-weight: 600;
        fill: #ffffff;
      }
      .card-text {
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        font-size: 14px;
        fill: #d0d7dd;
      }

      .grid-lines {
        stroke: #505050;
        stroke-width: 1;
        stroke-linecap: round;
      }

      .dot {
        fill: #9df3ff;
      }

      .lab-stroke {
        stroke: #9fd8ff;
        stroke-width: 1.8;
        fill: rgba(159,216,255,0.04);
      }
      .lab-light {
        stroke: #c8e9ff;
        stroke-width: 1.1;
        fill: none;
        opacity: 0.9;
      }
    </style>
  </defs>

  <!-- BG -->
  <rect x="0" y="0" width="1920" height="1200" fill="url(#bgGrad)"></rect>
  <rect x="1180" y="0" width="740" height="1200" fill="#000000" opacity="0.02"></rect>

  <!-- HEADER: Product Master -->
  <g transform="translate(120,120)">
    <!-- ✅ เส้นดำเฉพาะด้านซ้าย -->
    <line x1="0" y1="0" x2="260" y2="0" stroke="#000000" stroke-width="2" stroke-linecap="round"></line>

    <!-- ข้อความ (Product / Master เว้นออกจากกัน) -->
    <text class="title-text" x="280" y="5" fill="#ffffff">
      <tspan>P r o d u c t</tspan>
      <tspan dx="70">M a s t e r</tspan>
    </text>

    <!-- ✅ เส้นวิ่งหน้าคำ Product เท่านั้น -->
    <g filter="url(#lineGlow)">
      <path class="running-line" d="M 0 8 L 260 8"></path>
    </g>

    <text class="subtitle-text" x="4" y="40" fill="#c0cbd0">
      LAB RESEARCH • FORMULATION • STABILITY • PRODUCT ACCOUNTING
    </text>
  </g>

  <!-- เส้นหลักแบบตรง + มุมฉาก ฝั่งซ้าย -->
  <g filter="url(#lineGlow)">
    <path class="running-line" d="M 80 260 L 420 260 L 420 300 L 860 300"></path>
    <path class="running-line slow" d="M 80 300 L 320 300 L 320 340 L 760 340"></path>
    <path class="running-line" d="M 80 340 L 260 340 L 260 380 L 700 380"></path>
    <path class="running-line slow" d="M 260 340 L 260 420 L 520 420"></path>
  </g>

  <!-- grid เสริม -->
  <g opacity="0.35" class="grid-lines">
    <path d="M 60 430 L 1100 430"></path>
    <path d="M 60 470 L 1100 470"></path>
    <path d="M 60 510 L 1020 510"></path>
    <path d="M 240 220 L 240 780"></path>
    <path d="M 420 220 L 420 820"></path>
    <path d="M 600 230 L 600 820"></path>
  </g>

  <!-- จุดเล็กๆ -->
  <g opacity="0.9">
    <circle class="dot" cx="260" cy="260" r="3"></circle>
    <circle class="dot" cx="420" cy="260" r="3"></circle>
    <circle class="dot" cx="320" cy="300" r="3"></circle>
    <circle class="dot" cx="260" cy="340" r="3"></circle>
    <circle class="dot" cx="420" cy="420" r="3"></circle>
  </g>

  <!-- กล่องข้อความ 3 กล่อง + เส้นเชื่อม -->
  <g transform="translate(120,420)">
    <rect x="0" y="0" width="420" height="90" rx="8" fill="#262b30" stroke="#4a555e" stroke-width="1.2"></rect>
    <text class="card-title" x="24" y="30">
      1. Lab Research &amp; Formulation
    </text>
    <text class="card-text" x="24" y="52">
      • พัฒนาสูตรทดลอง, เลือกวัตถุดิบ, ทดลองหลาย batch เพื่อหา texture และประสิทธิภาพที่ดีที่สุด
    </text>
    <text class="card-text" x="24" y="72">
      • บันทึกข้อมูลทุกขั้นตอนลง Product Master เพื่อให้ทีม R&amp;D, QA, Accounting ใช้ร่วมกันได้
    </text>

    <rect x="520" y="-80" width="420" height="90" rx="8" fill="#252830" stroke="#4a555e" stroke-width="1.2"></rect>
    <text class="card-title" x="544" y="-50">
      2. Stability &amp; Safety Evaluation
    </text>
    <text class="card-text" x="544" y="-28">
      • ทดสอบความคงตัว, pH, สี, กลิ่น ภายใต้สภาวะเร่ง (accelerated condition)
    </text>
    <text class="card-text" x="544" y="-8">
      • บันทึกผล test, criteria ผ่าน/ไม่ผ่าน เพื่อใช้ประกอบการตัดสินใจขึ้นทะเบียนสินค้า
    </text>

    <rect x="520" y="120" width="420" height="90" rx="8" fill="#242730" stroke="#4a555e" stroke-width="1.2"></rect>
    <text class="card-title" x="544" y="150">
      3. Costing, Compliance &amp; Launch
    </text>
    <text class="card-text" x="544" y="172">
      • คำนวณต้นทุนต่อหน่วย, กำไรขั้นต้น และผูกข้อมูลเข้ากับรหัสบัญชีสินค้า (TP / KM / Channel)
    </text>
    <text class="card-text" x="544" y="192">
      • ตรวจสอบข้อกำกับ, เอกสารรองรับ และ sync ข้อมูลไปยังระบบขาย/บัญชีหน้าบ้าน
    </text>

    <path d="M 420 45 L 470 45 L 470 -35 L 520 -35" stroke="#7fa6c0" stroke-width="1.4" fill="none"></path>
    <path d="M 420 55 L 470 55 L 470 165 L 520 165" stroke="#7fa6c0" stroke-width="1.4" fill="none"></path>
  </g>

  <!-- กราฟฟิกนักวิจัย + อุปกรณ์แล็บ -->
  <g transform="translate(220,760)">
    <rect x="0" y="120" width="260" height="20" fill="rgba(0,0,0,0.65)" stroke="#6f7c82" stroke-width="1.4"></rect>
    <rect x="18" y="102" width="224" height="16" fill="rgba(0,0,0,0.85)" stroke="#9eaab0" stroke-width="1"></rect>

    <g class="lab-stroke">
      <polygon points="30,100 56,10 112,10 138,100"></polygon>
      <line x1="44" y1="58" x2="126" y2="58"></line>
      <circle cx="64" cy="74" r="5.2"></circle>
      <circle cx="104" cy="48" r="4.8"></circle>
    </g>

    <g class="lab-stroke">
      <rect x="170" y="26" width="40" height="90" rx="9"></rect>
      <rect x="176" y="0" width="28" height="26" rx="5"></rect>
      <line x1="176" y1="46" x2="210" y2="46"></line>
      <line x1="176" y1="66" x2="210" y2="66"></line>
      <line x1="176" y1="86" x2="210" y2="86"></line>
    </g>

    <g class="lab-light" transform="translate(110,-10)">
      <path d="M 40 115
               L 32 70
               C 30 60 32 52 40 46
               L 52 38
               C 60 34 68 36 72 42
               L 84 60
               L 92 115 Z" fill="rgba(159,216,255,0.06)"></path>
      <circle cx="64" cy="32" r="9"></circle>
      <rect x="88" y="70" width="44" height="22" rx="3" stroke="#9fd8ff" fill="rgba(0,0,0,0.6)"></rect>
      <line x1="92" y1="78" x2="126" y2="78"></line>
      <line x1="92" y1="86" x2="126" y2="86"></line>
      <line x1="52" y1="115" x2="46" y2="140"></line>
      <line x1="80" y1="115" x2="84" y2="140"></line>

      <path d="M 112 80
               L 180 40
               L 260 40
               L 260 -120" stroke="#9df3ff" stroke-width="2" stroke-dasharray="6 6" fill="none" opacity="0.9"></path>
    </g>
  </g>

  <rect x="0" y="0" width="1920" height="1200" fill="#000000" opacity="0.03"></rect>
</svg>
